<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Just A Rather Very Intelligent System</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            font-family: 'Arial', sans-serif;
            color: #00e5ff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            position: relative;
            width: 80%;
            max-width: 1200px;
        }

        .holo-display {
            position: relative;
            perspective: 1000px;
        }

        .holo-screen {
            position: relative;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid #00e5ff;
            border-radius: 10px;
            padding: 20px;
            transform: rotateX(15deg);
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.5);
            animation: float 3s ease infinite;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0) rotateX(15deg);
            }

            50% {
                transform: translateY(-20px) rotateX(15deg);
            }
        }

        .data-section {
            margin-top: 20px;
        }

        .data-section h2 {
            margin: 0;
            border-bottom: 1px solid #00e5ff;
            padding-bottom: 5px;
        }

        .data-section p,
        .data-section ul {
            margin: 10px 0 0 0;
        }

        .data-section ul {
            padding-left: 20px;
        }

        .data-section ul li {
            margin-bottom: 5px;
        }
    </style>
    <script>

        function noInput() {
           document.getElementById("userQuery").setAttribute("placeholder", "Please enter a query");
        }

        async function post(url, query) {
            await fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({query: query.value})
            });
        }

        async function submitQuery() {
            var query = document.getElementById("userQuery")
            if (query === "" || query === null) {
                noInput()
            } else {
                await post('/api/server/query',query).then(response => {
                    alert(response.toString());

                    console.log('Query submitted successfully');
                }).catch(error => {
                    console.error('Error submitting query:', error);
                });
            }
        }


    </script>
</head>

<body>
    <div class="container">
        <div class="holo-display">
            <div class="holo-screen">
                <h1>JARVIS Interface</h1>
                <p>Welcome, Sebastiaan.</p>
                <div class="data-section">
                    <h2>System Status</h2>
                    <p>All systems operational.</p>
                </div>
                <div class="data-section">
                    <h2>Recent Activities</h2>
                    <ul>
                    </ul>
                </div>
                <div class="query-input">
                    <h2>How can I help</h2>
                    <input type="text" id="userQuery" placeholder="Type your query here...">

                    </input>
                    <button id="submitQuery" onclick="submitQuery()">
                        Submit
                    </button>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
