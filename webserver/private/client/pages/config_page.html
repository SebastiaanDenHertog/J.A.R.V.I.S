<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Configuration</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: #fff;
            padding: 20px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="number"],
        select {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        input[type="checkbox"] {
            margin-right: 10px;
        }

        button {
            display: block;
            width: 100%;
            padding: 10px;
            background-color: #28a745;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #218838;
        }

        .loading {
            font-size: 0.9em;
            color: #007BFF;
        }

        .error {
            color: red;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Client Configuration</h1>
        <div id="client-loading" class="loading"></div>
        <form id="client-config-form" method="post"></form>
        <button type="button" id="save-button">Save Configuration</button>
    </div>

    <script>
        async function fetchClientConfig() {
            document.getElementById('client-loading').innerText = 'Loading configuration...';
            try {
                const response = await fetch('/api/client/config');
                if (response.ok) {
                    const config = await response.json();
                    displayClientConfig(config);
                    document.getElementById('client-loading').innerText = '';
                } else {
                    console.error('Failed to fetch client configuration.');
                    document.getElementById('client-loading').innerText = 'Failed to load configuration.';
                }
            } catch (error) {
                console.error('Error fetching client configuration:', error);
                document.getElementById('client-loading').innerText = 'Error loading configuration.';
            }
        }

        function displayClientConfig(config) {
            const form = document.getElementById('client-config-form');
            form.innerHTML = ''; // Clear any existing form elements

            for (const [key, value] of Object.entries(config)) {
                const label = document.createElement('label');
                label.innerText = key;

                let input;
                if (typeof value === 'boolean') {
                    input = document.createElement('input');
                    input.type = 'checkbox';
                    input.checked = value;
                } else if (typeof value === 'number') {
                    input = document.createElement('input');
                    input.type = 'number';
                    input.value = value;
                } else {
                    input = document.createElement('input');
                    input.type = 'text';
                    input.value = value;
                }

                input.id = key;
                input.name = key;
                form.appendChild(label);
                form.appendChild(input);
            }
        }

        async function saveClientConfig() {
            const inputs = document.querySelectorAll('#client-config-form input');
            const updatedConfig = {};

            inputs.forEach(input => {
                const key = input.id;
                if (input.type === 'checkbox') {
                    updatedConfig[key] = input.checked;
                } else if (input.type === 'number') {
                    updatedConfig[key] = parseFloat(input.value);
                } else {
                    updatedConfig[key] = input.value;
                }
            });

            try {
                const response = await fetch('/api/client/config/update', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(updatedConfig)
                });

                if (response.ok) {
                    alert('Configuration saved successfully.');
                } else {
                    alert('Error saving configuration.');
                }
            } catch (error) {
                alert('Failed to save configuration: ' + error.message);
            }
        }

        document.getElementById('save-button').addEventListener('click', saveClientConfig);

        document.addEventListener('DOMContentLoaded', fetchClientConfig);
    </script>

</body>

</html>
